<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 針對 iPad 優化的 viewport，禁止縮放以維持如同 App 的體驗 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>擴分挑戰賽</title>
    <style>
        /* 基礎重置與防呆設計 */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* 移除 iOS 點擊高光 */
        }

        body { 
            margin: 0; 
            padding: 0;
            font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif; 
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); /* 柔和的童趣漸層背景 */
            height: 100vh; /* 滿版高度 */
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden; /* 防止滾動 */
        }

        /* 遊戲主要容器 - 針對橫向加寬設計 */
        #game-container { 
            width: 90%; 
            max-width: 900px; 
            background: rgba(255, 255, 255, 0.95); 
            border-radius: 30px; 
            padding: 40px 60px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.15); 
            text-align: center; 
        }

        h1 {
            font-size: 48px;
            color: #2d3436;
            margin-top: 0;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* 關卡與分數資訊區塊 */
        .header-info {
            display: flex;
            justify-content: space-around;
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .badge {
            background: #ffeaa7;
            padding: 10px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 3px solid #fdcb6e;
        }

        /* 分數與算式顯示區塊 */
        #question-box { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 40px 0; 
        }

        .math-operator {
            font-size: 80px;
            margin: 0 40px;
            color: #2d3436;
        }

        .frac { 
            display: inline-flex; 
            flex-direction: column; 
            align-items: center; 
            vertical-align: middle; 
            font-size: 70px;
            font-weight: bold;
        }

        .frac .num { 
            padding: 5px 20px; 
        }

        .frac .den { 
            padding: 10px 20px 5px; 
            border-top: 8px solid #2d3436; /* 分數線加粗 */
        }

        /* 隱藏數字輸入框的上下箭頭 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        input { 
            font-size: 55px; 
            width: 140px; 
            text-align: center; 
            border: 4px solid #74b9ff; 
            border-radius: 15px; 
            outline: none;
            color: #0984e3;
            background: #fdfdfd;
            font-family: inherit;
            font-weight: bold;
            transition: border-color 0.2s;
            -moz-appearance: textfield;
        }

        input:focus {
            border-color: #0984e3;
            box-shadow: 0 0 15px rgba(116, 185, 255, 0.5);
        }

        /* 大尺寸按鈕 */
        button { 
            font-size: 32px; 
            font-weight: bold;
            padding: 15px 50px; 
            background: #0984e3; 
            color: white; 
            border: none; 
            border-radius: 20px; 
            cursor: pointer; 
            box-shadow: 0 8px 15px rgba(9, 132, 227, 0.4);
            transition: all 0.1s; 
            margin-top: 10px;
            font-family: inherit;
        }

        button:active { 
            transform: translateY(6px); 
            box-shadow: 0 2px 5px rgba(9, 132, 227, 0.4); 
        }

        /* 訊息提示 */
        .msg { 
            margin-top: 30px; 
            font-size: 32px; 
            font-weight: bold; 
            min-height: 45px; 
        }

        /* 遊戲通關彈出視窗 (Modal) */
        #modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.6);
            display: none; /* 預設隱藏 */
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(5px);
        }

        .modal-box {
            background: white;
            padding: 60px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-box h2 {
            font-size: 60px;
            color: #d63031;
            margin: 0 0 40px 0;
        }

        .modal-box button {
            background: #00b894;
            box-shadow: 0 8px 15px rgba(0, 184, 148, 0.4);
        }
        
        .modal-box button:active {
            box-shadow: 0 2px 5px rgba(0, 184, 148, 0.4);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

    </style>
</head>
<body>

<div id="game-container">
    <h1>🚀 擴分挑戰賽</h1>
    
    <div class="header-info">
        <div class="badge">當前關卡：第 <span id="lv-num">1</span> 關</div>
        <div class="badge">累積得分：<span id="score">0</span></div>
    </div>
    
    <div id="question-box">
        <!-- 題目將透過 JavaScript 動態生成在此 -->
    </div>

    <button onclick="check()">提交答案</button>
    <div id="feedback" class="msg"></div>
</div>

<!-- 通關視窗 -->
<div id="modal-overlay">
    <div class="modal-box">
        <h2>🎉 恭喜通關全三關！</h2>
        <button onclick="resetGame()">再來一次</button>
    </div>
</div>

<script>
    let score = 0;
    let lv = 1;
    let correctAns = 0;

    function makeQuiz() {
        let n1, d1, factor;
        document.getElementById('lv-num').innerText = lv;
        
        // 難度分級邏輯
        if (lv === 1) { // 第一關：簡單倍數 (2, 3)
            n1 = Math.floor(Math.random() * 3) + 1;
            d1 = Math.floor(Math.random() * 3) + 4;
            factor = Math.floor(Math.random() * 2) + 2;
        } else if (lv === 2) { // 第二關：中等倍數 (4, 5, 6)
            n1 = Math.floor(Math.random() * 5) + 2;
            d1 = Math.floor(Math.random() * 5) + 8;
            factor = Math.floor(Math.random() * 3) + 4;
        } else { // 第三關：大倍數 (10) 或較難組合
            n1 = Math.floor(Math.random() * 8) + 2;
            d1 = Math.floor(Math.random() * 5) + 11;
            factor = 10;
        }

        correctAns = d1 * factor;
        let n2 = n1 * factor;

        // 將輸入框直接放在分數的結構中，更直覺
        document.getElementById('question-box').innerHTML = `
            <div class="frac">
                <div class="num">${n1}</div>
                <div class="den">${d1}</div>
            </div>
            <div class="math-operator">=</div>
            <div class="frac">
                <div class="num">${n2}</div>
                <div class="den">
                    <input type="number" id="user-input" placeholder="?">
                </div>
            </div>
        `;

        // 綁定鍵盤 Enter 鍵送出功能
        let inputEl = document.getElementById('user-input');
        inputEl.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                check();
            }
        });
        
        // 在新題目生成時自動 focus 輸入框 (在實體鍵盤或部分瀏覽器中能加快操作)
        inputEl.focus();
    }

    function check() {
        let inputEl = document.getElementById('user-input');
        let val = inputEl.value;
        let msg = document.getElementById('feedback');
        
        if (val === "") {
            msg.style.color = "#d63031";
            msg.innerText = "請輸入數字喔！";
            inputEl.focus();
            return;
        }
        
        if (val == correctAns) {
            score++;
            document.getElementById('score').innerText = score;
            msg.style.color = "#00b894"; // 柔和的綠色
            msg.innerText = "🌟 正確！你是誠實的小老師！";
            
            // 過關門檻：每 5 分升一級
            if (score === 15) {
                // 達到 15 分，顯示自訂通關視窗
                document.getElementById('modal-overlay').style.display = 'flex';
                return; // 暫停出新題目
            }

            if (score >= 10) lv = 3;
            else if (score >= 5) lv = 2;

            // 答對後立即出下一題
            makeQuiz();
        } else {
            msg.style.color = "#d63031"; // 柔和的紅色
            msg.innerText = "❌ 算錯了，再細心檢查一下！";
            inputEl.value = ""; // 清空錯誤答案
            inputEl.focus();   // 游標移回輸入框
        }
    }

    // 重置遊戲 (從 Modal 觸發)
    function resetGame() {
        score = 0;
        lv = 1;
        document.getElementById('score').innerText = score;
        document.getElementById('feedback').innerText = "";
        document.getElementById('modal-overlay').style.display = 'none';
        makeQuiz();
    }

    // 初始化第一題
    makeQuiz();
</script>

</body>
</html>
